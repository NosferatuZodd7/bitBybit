# bitBybit (Rust): format, lint and test on Linux (platform-neutral crates) and on Windows (everything), then the
# signed update. Every push to the development branch is published as a TESTING build (GitHub pre-release
# vX.Y.Z-dev.N); a pushed tag vX.Y.Z publishes a STABLE release (tags are only pushed by the owner). Nothing is
# published unless the Windows tests pass and the manifest is signed with the BITBYBIT_UPDATE_SIGNING_KEY secret
# and verifies with the public key embedded in the app (fail closed).
name: rust

on:
  push:
    branches: ['claude/**']
    tags: ['v*']
    paths: ['crates/**', 'ui/**', '.gitattributes', '.gitignore', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml', 'clippy.toml', 'installer/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Testing: workspace version + "-dev.<run>" (moved to the next patch if that version is already stable).
  # Stable (tag vX.Y.Z): the tag must equal the workspace version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      channel: ${{ steps.decide.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - id: decide
        shell: bash
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$base" ]; then echo "::error::No workspace version in Cargo.toml"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match $base"; exit 1; fi
            echo "version=$base" >> "$GITHUB_OUTPUT"; echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null; then
              IFS=. read -r major minor patch <<< "$base"; base="$major.$minor.$((patch + 1))"
              echo "::warning::v$base is the next patch: the workspace version is already published as stable."
            fi
            echo "version=$base-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "channel=testing" >> "$GITHUB_OUTPUT"
          fi

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
      - name: System libraries for the Slint UI
        run: sudo apt-get update -q && sudo apt-get install -y -q libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Type-check for Windows
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Release build (version and update repository baked in)
        env:
          BITBYBIT_VERSION: ${{ needs.version.outputs.version }}
          BITBYBIT_UPDATE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          cargo build --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }
          New-Item -ItemType Directory -Force rel | Out-Null
          Copy-Item target/release/bitBybit.exe, target/release/bitbybit-service.exe, target/release/bitbybit-cli.exe rel/
      - name: MSI (WiX v5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix install failed" }
          # MSI versions are numeric: major.minor.<run number> (always increasing across both channels).
          $base = '${{ needs.version.outputs.version }}'.Split('-')[0].Split('.')
          $msi = "$($base[0]).$($base[1]).${{ github.run_number }}"
          wix build installer/bitBybit.wxs -arch x64 -d Bin=rel -d Version=$msi -o rel/bitBybit.msi
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }
          Remove-Item rel/*.wixpdb -ErrorAction SilentlyContinue
      - name: Opt-in system-change tests (disposable runner only)
        env:
          BITBYBIT_ALLOW_SYSTEM_CHANGES: '1'
        run: cargo test -p bitbybit-platform-windows --test firewall_rules --locked -- --nocapture
      - name: Broker smoke test (console broker, developer mode for the test binaries)
        shell: pwsh
        run: |
          $config = Join-Path $env:ProgramData 'bitBybit\config'
          New-Item -ItemType Directory -Force $config | Out-Null
          $dir = (Resolve-Path target\debug).Path
          @{ enabled = $true; directory = $dir } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $config 'broker-developer-mode.json')
          cargo build -p bitbybit-service --locked
          $broker = Start-Process -FilePath target\debug\bitbybit-service.exe -ArgumentList '--console' -PassThru
          try {
            $env:BITBYBIT_SERVICE_SMOKE = '1'
            cargo test -p bitbybit-service --test smoke --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw "broker smoke test failed" }
            cargo build -p bitbybit-cli --locked
            $cli = (& target\debug\bitbybit-cli.exe network) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $cli -notmatch '"interfaces"') { throw "bitbybit-cli network failed" }
            Write-Output ("bitbybit-cli network: {0} characters of JSON" -f $cli.Length)
            $displays = (& target\debug\bitbybit-cli.exe displays) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "bitbybit-cli displays failed" }
            Write-Output "bitbybit-cli displays: $displays"
            $diag = Join-Path $env:RUNNER_TEMP "diagnose\"
            & target\debug\bitbybit-cli.exe diagnose --out $diag
            if ($LASTEXITCODE -ne 0) { throw "bitbybit-cli diagnose failed" }
            Get-Content (Join-Path $diag "bitbybit-report.txt") -TotalCount 60
            # The app itself against the console broker (not LocalSystem, hence the explicit developer opt-in).
            cargo build -p bitbybit-app --locked
            $env:BITBYBIT_DEV_BROKER = '1'
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            # Network (0), case analysis (6, runs its read-only analysis) and displays (5).
            foreach ($page in @('0', '6', '5')) {
              $env:BITBYBIT_UI_PAGE = $page
              $app = Start-Process -FilePath target\debug\bitBybit.exe -PassThru
              Start-Sleep -Seconds $(if ($page -eq '6') { 40 } else { 12 })
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path (Get-Location) "app-windows-page$page.png"))
              # Small JPEG copy in the log too (readable through the logs API when artifacts are not reachable).
              $thumb = New-Object System.Drawing.Bitmap $bitmap, 960, ([int]($bounds.Height * 960 / $bounds.Width))
              $memory = New-Object System.IO.MemoryStream
              $thumb.Save($memory, [System.Drawing.Imaging.ImageFormat]::Jpeg)
              $b64 = [Convert]::ToBase64String($memory.ToArray())
              Write-Output "BITBYBIT-SCREENSHOT-BEGIN page=$page"
              for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Output ('B64:' + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
              Write-Output 'BITBYBIT-SCREENSHOT-END'
              if ($app.HasExited) { throw "bitBybit.exe exited early with code $($app.ExitCode)" }
              Stop-Process -Id $app.Id -Force
              Start-Sleep -Seconds 2
            }
          } finally {
            Stop-Process -Id $broker.Id -Force
            Get-Content (Join-Path $env:ProgramData 'bitBybit\logs\*') -ErrorAction SilentlyContinue | Select-Object -Last 40
          }
      - name: Upload the app screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-screenshot
          path: app-windows-page*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bitBybit-win-x64-unsigned
          path: rel
          if-no-files-found: error

  # Signs the manifest and publishes the release the app updates from (development branch and v* tags only).
  publish:
    needs: [version, linux, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/claude/windows-network-manager-hb8idp' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      HAS_KEY: ${{ secrets.BITBYBIT_UPDATE_SIGNING_KEY != '' }}
    steps:
      - name: Signing key configured?
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::Secret BITBYBIT_UPDATE_SIGNING_KEY is not set: this build is NOT published as an update (fail closed)."
          echo "### Atualização não publicada (falta o segredo BITBYBIT_UPDATE_SIGNING_KEY)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: bitBybit-win-x64-unsigned
          path: rel
      - name: Manifest, signature, verification with the app's embedded key
        if: env.HAS_KEY == 'true'
        env:
          BITBYBIT_UPDATE_SIGNING_KEY: ${{ secrets.BITBYBIT_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tool="cargo run -q --locked -p bitbybit-release --"
          $tool manifest --version "$VERSION" --channel "$CHANNEL" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --out rel/bitbybit-manifest.json rel/bitBybit.exe rel/bitbybit-service.exe rel/bitbybit-cli.exe rel/bitBybit.msi
          $tool sign --manifest rel/bitbybit-manifest.json --out rel/bitbybit-manifest.json.sig
          # The app only trusts its embedded public key(s): refuse to publish anything it would reject.
          $tool verify --manifest rel/bitbybit-manifest.json --sig rel/bitbybit-manifest.json.sig --assets rel
          (cd rel && sha256sum bitBybit.exe bitbybit-service.exe bitbybit-cli.exe bitBybit.msi > SHA256SUMS.txt)
      - name: Publish the GitHub release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          {
            if [ "$CHANNEL" = "testing" ]; then
              echo "Versão de testes publicada automaticamente a partir de ${GITHUB_SHA:0:7}. O bitBybit no canal **Testes** instala-a sozinho."
            else
              echo "Versão estável."
            fi
            echo
            git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
          } > notes.md
          flags=()
          if [ "$CHANNEL" = "testing" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "bitBybit $VERSION" --notes-file notes.md "${flags[@]}" \
            rel/bitBybit.exe rel/bitbybit-service.exe rel/bitbybit-cli.exe rel/bitBybit.msi rel/bitbybit-manifest.json rel/bitbybit-manifest.json.sig rel/SHA256SUMS.txt
          echo "### Publicado: $tag ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
