# Rust rewrite: format, lint and test on Linux (platform-neutral crates) and on Windows (everything).
# Nothing is published from here until the migration matrix says the Rust app replaces the C# one.
name: rust

on:
  push:
    branches: ['claude/**']
    paths: ['crates/**', 'ui/**', '.gitattributes', '.gitignore', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml', 'clippy.toml', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Type-check for Windows
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-msvc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo build --workspace --release --locked
      - name: Broker smoke test (console broker, developer mode for the test binaries)
        shell: pwsh
        run: |
          $config = Join-Path $env:ProgramData 'bitBybit\config'
          New-Item -ItemType Directory -Force $config | Out-Null
          $dir = (Resolve-Path target\debug).Path
          @{ enabled = $true; directory = $dir } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $config 'broker-developer-mode.json')
          cargo build -p bitbybit-service --locked
          $broker = Start-Process -FilePath target\debug\bitbybit-service.exe -ArgumentList '--console' -PassThru
          try {
            $env:BITBYBIT_SERVICE_SMOKE = '1'
            cargo test -p bitbybit-service --test smoke --locked -- --nocapture
          } finally {
            Stop-Process -Id $broker.Id -Force
            Get-Content (Join-Path $env:ProgramData 'bitBybit\logs\*') -ErrorAction SilentlyContinue | Select-Object -Last 40
          }
