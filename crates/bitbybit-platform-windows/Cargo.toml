[package]
name = "bitbybit-platform-windows"
description = "Windows implementations of bitBybit's platform ports (IP Helper, Core Audio, SetupAPI, WFP, WinNAT, ICS, firewall, named pipes, WinHTTP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bitbybit-audio.workspace = true
bitbybit-core.workspace = true
bitbybit-display.workspace = true
bitbybit-drivers.workspace = true
bitbybit-domain.workspace = true
bitbybit-ipc.workspace = true
bitbybit-journal.workspace = true
bitbybit-network.workspace = true
bitbybit-recovery.workspace = true
bitbybit-security.workspace = true
serde_json.workspace = true
log.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
# Needed by the `interface` macro for the undocumented IPolicyConfig (same version `windows` uses).
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]

[dev-dependencies]
bitbybit-updates.workspace = true

[lints]
workspace = true
