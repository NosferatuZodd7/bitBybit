[package]
name = "bitbybit-platform-windows"
description = "Windows implementations of bitBybit's platform ports (IP Helper, Core Audio, SetupAPI, WFP, WinNAT, ICS, firewall, named pipes, WinHTTP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bitbybit-core.workspace = true
bitbybit-ipc.workspace = true
bitbybit-network.workspace = true
log.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
