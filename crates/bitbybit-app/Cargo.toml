[package]
name = "bitbybit-app"
description = "bitBybit desktop app (Slint, pt-PT): unelevated UI talking to the bitBybit service over the broker pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "bitBybit"
path = "src/main.rs"

[dependencies]
bitbybit-core.workspace = true
bitbybit-localization.workspace = true
bitbybit-network.workspace = true
slint.workspace = true

[target.'cfg(windows)'.dependencies]
bitbybit-ipc.workspace = true
bitbybit-platform-windows.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
time.workspace = true

[lints]
workspace = true
