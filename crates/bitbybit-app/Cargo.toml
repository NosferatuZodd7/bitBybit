[package]
name = "bitbybit-app"
description = "bitBybit desktop app (Slint, pt-PT): unelevated UI talking to the bitBybit service over the broker pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "bitBybit"
path = "src/main.rs"

[dependencies]
